
name: CI-CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/keervidhi/devops-demo:latest

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: docker build -t $IMAGE .
      - name: Push image
        run: docker push $IMAGE

        
  deploy:
    needs: package
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull ghcr.io/keervidhi/devops-demo:latest

      - name: Replace running container
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=devops-demo-app"
          if ($existing) {
            docker rm -f devops-demo-app
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run application
        run: docker run -d --restart unless-stopped -p 5000:5000 --name devops-demo-app ghcr.io/keervidhi/devops-demo:latest
